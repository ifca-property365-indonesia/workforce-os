# Workforce OS — this server (Cloudflare-proxied, Cloudflare Origin wildcard cert)
server {
    listen 80;
    server_name ai.vardiv.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ai.vardiv.id;

    ssl_certificate     /etc/nginx/ssl/vardiv.pem;
    ssl_certificate_key /etc/nginx/ssl/vardiv.key;

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Server-Sent Events: no buffering, long timeouts
    location /api/events {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
