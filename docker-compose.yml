# Fresh Ubuntu VPS: see README → "Deploy with Docker Compose".
name: workforce-os

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://workforce:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/workforce_os
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/storage

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workforce_os
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce -d workforce_os"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrate, args: { WFOS_COMMIT: "${WFOS_COMMIT:-}" } }
    <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web, args: { WFOS_COMMIT: "${WFOS_COMMIT:-}" } }
    <<: *app-env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes: [storage:/data/storage]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 10

  worker:
    build: { context: ., target: worker, args: { WFOS_COMMIT: "${WFOS_COMMIT:-}" } }
    <<: *app-env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes: [storage:/data/storage]
    stop_grace_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # renew twice a day; nginx picks up renewed certs on its periodic reload below
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

volumes:
  pgdata:
  redisdata:
  storage:
  certbot-www:
  letsencrypt:
